<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>跨标签页操作同步助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="" width="36" height="36">
    <h1>标签页同步</h1>
    <span class="version">v1.8.10</span>
  </header>
  <main>
    <section class="card hero" aria-labelledby="sync-title">
      <div class="hero-line">
        <div>
          <h2 id="sync-title">操作同步</h2>
          <p id="sync-state" aria-live="polite">正在读取状态…</p>
        </div>
        <label class="switch"><input type="checkbox" id="enabled" role="switch" aria-labelledby="sync-title" disabled><span></span></label>
      </div>
      <div class="metrics" id="metrics">
        <span><span class="metric-value" id="count">0</span> 已选</span>
        <span><span class="metric-value" id="ready-count">—</span> 已连接</span>
        <span><span class="metric-value" id="attention-count">—</span> 待核对</span>
      </div>
    </section>

    <section aria-labelledby="tabs-title">
      <div class="section-head">
        <h2 id="tabs-title">同步组</h2>
        <button type="button" id="check" class="text-button" disabled>检查连接</button>
      </div>
      <div class="card">
        <ul id="tabs" aria-label="参与同步的标签页"></ul>
        <details id="available">
          <summary>添加标签页 <span id="available-count"></span></summary>
          <ul id="other-tabs" aria-label="可添加的标签页"></ul>
        </details>
      </div>
    </section>

    <div class="actions">
      <button id="tile" class="button primary" type="button" disabled>平铺窗口</button>
      <button id="dup-toggle" class="button secondary" type="button" aria-controls="duplicate" aria-expanded="false">复制当前页</button>
    </div>
    <section class="card controls" id="duplicate" hidden aria-label="复制当前标签页">
      <p>复制空白模板页，新标签页会加入同步组。</p>
      <div class="duplicate-actions">
        <button type="button" class="dup-quick button secondary" data-n="2">2 份</button>
        <button type="button" class="dup-quick button secondary" data-n="4">4 份</button>
        <button type="button" class="dup-quick button secondary" data-n="6">6 份</button>
        <button type="button" class="dup-quick button secondary" data-n="9">9 份</button>
        <input id="dupN" type="number" min="1" max="16" step="1" placeholder="1–16" aria-label="自定义复制份数">
        <button id="dupGo" type="button" class="button primary">复制</button>
      </div>
    </section>
    <section aria-labelledby="clipboard-title">
      <div class="section-head"><h2 id="clipboard-title">剪贴板</h2></div>
      <div class="actions">
        <button type="button" class="button secondary" data-paste="all" title="Alt+Shift+V" disabled>同步粘贴</button>
        <button type="button" class="button secondary" data-paste="lines" title="Alt+Shift+L" disabled>分行粘贴</button>
      </div>
    </section>
    <p class="feedback" id="feedback" role="status" hidden></p>

    <section aria-labelledby="isolation-title">
      <div class="section-head"><h2 id="isolation-title">不同步的字段</h2></div>
      <div class="card">
        <ul id="excluded"></ul>
        <button id="addExcluded" type="button" class="text-button full" disabled>＋ 在页面上选取</button>
      </div>
    </section>

    <details class="card settings">
      <summary>同步设置与快捷键</summary>
      <div class="settings-content">
        <label class="setting">鼠标点击与拖选<span class="switch"><input type="checkbox" data-opt="click" role="switch"><span></span></span></label>
        <label class="setting">键盘与输入<span class="switch"><input type="checkbox" data-opt="keys" role="switch"><span></span></span></label>
        <label class="setting">滚动<span class="switch"><input type="checkbox" data-opt="scroll" role="switch"><span></span></span></label>
        <label class="setting">滚动位置<select data-opt="scrollMode"><option value="absolute">绝对像素</option><option value="relative">页面百分比</option></select></label>
        <label class="setting">页面跳转<span class="switch"><input type="checkbox" data-opt="nav" role="switch"><span></span></span></label>
        <label class="setting">镜像鼠标<span class="switch"><input type="checkbox" data-opt="ghost" role="switch"><span></span></span></label>
        <div class="setting color-setting" data-color="ghostColor">
          <span id="cursor-color-label">副鼠标颜色</span>
          <div class="color-controls">
            <input class="color-picker" type="color" aria-labelledby="cursor-color-label">
            <input class="color-hex" type="text" aria-label="副鼠标 HEX 色值" maxlength="7" spellcheck="false" autocomplete="off">
          </div>
        </div>
        <div class="setting color-setting" data-color="themeColor">
          <span id="theme-color-label">界面主题色</span>
          <div class="color-controls">
            <input class="color-picker" type="color" aria-labelledby="theme-color-label">
            <input class="color-hex" type="text" aria-label="主题 HEX 色值" maxlength="7" spellcheck="false" autocomplete="off">
          </div>
        </div>
        <label class="setting"><span>精确模式<small>普通模式无法触发操作时试用。浏览器会显示调试提示。</small></span><span class="switch"><input type="checkbox" data-opt="precision" role="switch"><span></span></span></label>
      </div>
      <div class="shortcuts">
        <span><kbd>Alt+,</kbd> 开启</span><span><kbd>Alt+.</kbd> 关闭</span>
        <span><kbd>Alt+Shift+G</kbd> 加入或移出</span><span><kbd>Alt+Shift+S</kbd> 平铺</span>
        <span><kbd>Alt+Shift+V</kbd> 同步粘贴</span><span><kbd>Alt+Shift+L</kbd> 分行粘贴</span>
        <span><kbd>Alt+Shift+X</kbd> 清空剪贴板（同步页）</span>
      </div>
    </details>
  </main>
  <template id="tab-row">
    <li class="tab-row">
      <button type="button" class="tab-open">
        <span class="tab-icon" aria-hidden="true"></span>
        <span class="tab-label"><span class="tab-title"></span><small class="tab-url"></small></span>
      </button>
      <span class="tab-result" hidden></span>
      <input class="tab-select" type="checkbox">
    </li>
  </template>
  <script src="cursor-colors.js"></script>
  <script src="popup.js"></script>
</body>
</html>
